# Builds the theme zip and attaches it, with its checksum, to a GitHub release v<version>.
# Runs when a v<version> tag is pushed, or from the Actions tab (or the API) with a version, which tags the
# current main. The version must match style.css and readme.txt.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Theme version, e.g. 0.4.2 (must match style.css; the tag is v<version>)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION=${INPUT_VERSION:-${GITHUB_REF_NAME#v}}
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 0.4.2"; exit 1; }
          THEME_VERSION=$(sed -n 's/^Version: *//p' style.css | head -1)
          [ "$VERSION" = "$THEME_VERSION" ] || { echo "v$VERSION does not match style.css Version $THEME_VERSION"; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION is already released"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Theme check on WordPress Playground
        working-directory: tests
        run: |
          npm ci
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
          npm run theme
      - name: Build the zip
        run: bin/build-zip.sh
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="= $VERSION =" '$0==v{on=1;next} on&&/^= /{exit} on' readme.txt > notes.md
          printf '\nInstall: Appearance > Themes > Add New > Upload Theme, and choose anypress.zip.\n\nSHA-256: `%s`\n' "$(cut -d' ' -f1 dist/SHA256SUMS)" >> notes.md
          gh release create "v$VERSION" dist/anypress.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "AnyPress $VERSION" --notes-file notes.md
