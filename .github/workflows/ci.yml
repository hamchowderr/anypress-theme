name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none
      - name: PHP syntax (8.1, the lowest version the theme supports)
        run: find . -name '*.php' -not -path './tests/node_modules/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install the checks
        working-directory: tests
        run: |
          npm ci
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Get AnyPress Blocks (latest release, retried)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh release download -R hamchowderr/anypress-blocks -p anypress-blocks.zip -D "$RUNNER_TEMP" --clobber && break
            [ "$i" = 5 ] && exit 1; sleep $((i * 15))
          done
          unzip -q "$RUNNER_TEMP/anypress-blocks.zip" -d "$RUNNER_TEMP/blocks"
          echo "ANYPRESS_BLOCKS=$RUNNER_TEMP/blocks/anypress-blocks" >> "$GITHUB_ENV"
      - name: Theme check on WordPress Playground
        working-directory: tests
        run: npm run theme
      - name: Build the zip
        run: bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: anypress-theme
          path: |
            dist/anypress.zip
            tests/shots/
